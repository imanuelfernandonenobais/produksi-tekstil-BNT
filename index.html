<script>
/* =========================================================
   PRODUKSI TEKSTIL
   JAVASCRIPT VERSI RAPI - PER FUNGSI
   ========================================================= */


/* =========================================================
   1. KONFIGURASI
   BAGIAN INI YANG PALING MUDAH DIUBAH
   ========================================================= */

const CONFIG = {

  appName: "Produksi Tekstil",

  apiUrl:
    "https://script.google.com/macros/s/AKfycbwiJKc4yLIFkyX6RRsFbAi4q0VUY6eHMHjbdABJLXpMvrgJNXW2T4MONau2RunulQAB/exec",

  machines: [
    "Mesin 1",
    "Mesin 2",
    "Mesin 3",
    "Mesin 4",
    "Mesin 5"
  ],

  shifts: [
    "Pagi",
    "Siang",
    "Malam"
  ],

  statuses: [
    "Berjalan",
    "Perbaikan",
    "Berhenti"
  ],

  defaultShift: "Pagi",

  defaultStatus: "Berjalan"

};


/* =========================================================
   2. STATE / DATA SEMENTARA
   ========================================================= */

let sharedData = [];

let selectedShift =
  CONFIG.defaultShift;

let selectedStatus =
  CONFIG.defaultStatus;


/* =========================================================
   3. HELPER - AMBIL ELEMENT HTML
   ========================================================= */

function getElement(id) {

  return document.getElementById(id);

}


/* =========================================================
   4. HELPER - TANGGAL HARI INI
   ========================================================= */

function getToday() {

  const date =
    new Date();

  const offset =
    date.getTimezoneOffset();

  return new Date(
    date.getTime() -
    offset * 60000
  )
    .toISOString()
    .slice(0, 10);

}


/* =========================================================
   5. HELPER - BUAT ID UNIK
   ========================================================= */

function generateId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }

  return (
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/* =========================================================
   6. HELPER - AMANKAN TEXT HTML
   ========================================================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /[&<>"']/g,
      function(character) {

        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return map[character];

      }
    );

}


/* =========================================================
   7. HELPER - DELAY
   ========================================================= */

function delay(ms) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


/* =========================================================
   8. SETUP DAFTAR MESIN
   ========================================================= */

function setupMachineOptions() {

  const machineSelect =
    getElement("mesin");

  machineSelect.innerHTML =
    CONFIG.machines
      .map(
        function(machine) {

          return `
            <option value="${escapeHtml(machine)}">
              ${escapeHtml(machine)}
            </option>
          `;

        }
      )
      .join("");

}


/* =========================================================
   9. MEMBUAT BUTTON PILIHAN
   Digunakan untuk Shift dan Status Mesin
   ========================================================= */

function createChoiceButtons(
  containerId,
  values,
  activeValue
) {

  const container =
    getElement(containerId);

  container.innerHTML =
    values
      .map(
        function(value) {

          const activeClass =
            value === activeValue
              ? " active"
              : "";

          return `
            <button
              type="button"
              class="choice${activeClass}"
              data-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>
          `;

        }
      )
      .join("");

}


/* =========================================================
   10. SETUP SHIFT DAN STATUS
   ========================================================= */

function setupChoiceButtons() {

  createChoiceButtons(
    "shiftChoices",
    CONFIG.shifts,
    selectedShift
  );

  createChoiceButtons(
    "statusChoices",
    CONFIG.statuses,
    selectedStatus
  );

  bindChoiceEvents();

}


/* =========================================================
   11. MENGAKTIFKAN PILIHAN
   ========================================================= */

function setActiveChoice(
  containerId,
  selectedValue
) {

  document
    .querySelectorAll(
      "#" +
      containerId +
      " .choice"
    )
    .forEach(
      function(button) {

        button.classList.toggle(
          "active",
          button.dataset.value ===
            selectedValue
        );

      }
    );

}


/* =========================================================
   12. EVENT SHIFT DAN STATUS
   ========================================================= */

function bindChoiceEvents() {

  document
    .querySelectorAll(
      "#shiftChoices .choice"
    )
    .forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            selectedShift =
              button.dataset.value;

            setActiveChoice(
              "shiftChoices",
              selectedShift
            );

          }
        );

      }
    );


  document
    .querySelectorAll(
      "#statusChoices .choice"
    )
    .forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            selectedStatus =
              button.dataset.value;

            setActiveChoice(
              "statusChoices",
              selectedStatus
            );

          }
        );

      }
    );

}


/* =========================================================
   13. HITUNG TOTAL PRODUKSI
   Total = Jumlah Roll × Berat/Roll
   ========================================================= */

function calculateTotalProduction() {

  const roll =
    Number(
      getElement("roll").value ||
      0
    );

  const weight =
    Number(
      getElement("berat").value ||
      0
    );

  const total =
    roll * weight;

  getElement("total")
    .textContent =
    total.toLocaleString(
      "id-ID"
    ) +
    " kg";

}


/* =========================================================
   14. JSONP
   Digunakan untuk membaca Google Sheets
   ========================================================= */

function requestJsonp(params) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2);


      const script =
        document.createElement(
          "script"
        );


      const timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                "Waktu koneksi habis"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );

        delete window[
          callbackName
        ];

        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        function(result) {

          cleanup();

          resolve(
            result
          );

        };


      params.callback =
        callbackName;

      params.t =
        Date.now();


      const queryString =
        Object
          .keys(params)
          .map(
            function(key) {

              return (
                encodeURIComponent(
                  key
                ) +
                "=" +
                encodeURIComponent(
                  params[key]
                )
              );

            }
          )
          .join("&");


      script.src =
        CONFIG.apiUrl +
        "?" +
        queryString;


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              "Gagal membaca data"
            )
          );

        };


      document.body
        .appendChild(
          script
        );

    }
  );

}


/* =========================================================
   15. LOAD DATA DARI GOOGLE SHEETS
   ========================================================= */

async function loadData() {

  const connection =
    getElement(
      "connection"
    );


  connection.textContent =
    "Memuat data bersama...";


  try {

    const response =
      await requestJsonp({
        action: "list"
      });


    if (
      !response ||
      response.ok === false
    ) {

      throw new Error(
        (
          response &&
          response.message
        ) ||
        "Respons tidak valid"
      );

    }


    sharedData =
      response.data || [];


    connection.textContent =
      "Terhubung ✓ · " +
      sharedData.length +
      " data bersama";


    renderAllData();


    return sharedData;

  }

  catch(error) {

    connection.textContent =
      "Koneksi gagal: " +
      error.message;

    throw error;

  }

}


/* =========================================================
   16. VALIDASI FORM
   ========================================================= */

function validateForm() {

  const name =
    getElement(
      "penginput"
    )
      .value
      .trim();


  const roll =
    Number(
      getElement(
        "roll"
      ).value || 0
    );


  const weight =
    Number(
      getElement(
        "berat"
      ).value || 0
    );


  if (!name) {

    return {
      valid: false,
      message:
        "Isi Nama Penginput."
    };

  }


  if (roll <= 0) {

    return {
      valid: false,
      message:
        "Jumlah Roll harus lebih dari 0."
    };

  }


  if (weight <= 0) {

    return {
      valid: false,
      message:
        "Berat/Roll harus lebih dari 0."
    };

  }


  return {
    valid: true
  };

}


/* =========================================================
   17. MEMBUAT DATA PRODUKSI
   ========================================================= */

function createProductionPayload(
  recordId
) {

  return {

    id:
      recordId,

    tanggal:
      getElement(
        "tanggal"
      ).value,

    mesin:
      getElement(
        "mesin"
      ).value,

    shift:
      selectedShift,

    jenisKain:
      getElement(
        "kain"
      )
        .value
        .trim() ||
      "-",

    jumlahRoll:
      Number(
        getElement(
          "roll"
        ).value || 0
      ),

    beratRoll:
      Number(
        getElement(
          "berat"
        ).value || 0
      ),

    status:
      selectedStatus,

    kendala:
      getElement(
        "kendala"
      )
        .value
        .trim() ||
      "-",

    penginput:
      getElement(
        "penginput"
      )
        .value
        .trim()

  };

}


/* =========================================================
   18. STATUS TOMBOL SIMPAN
   ========================================================= */

function setSaveButtonLoading(
  isLoading
) {

  const button =
    getElement(
      "saveBtn"
    );


  button.disabled =
    isLoading;


  button.textContent =
    isLoading
      ? "Mengirim..."
      : "💾 Simpan ke Google Sheets";

}


/* =========================================================
   19. SIMPAN DATA KE GOOGLE SHEETS
   ========================================================= */

async function saveProductionData() {

  const validation =
    validateForm();


  if (
    !validation.valid
  ) {

    alert(
      validation.message
    );

    return;

  }


  const inputName =
    getElement(
      "penginput"
    )
      .value
      .trim();


  localStorage.setItem(
    "nama_penginput",
    inputName
  );


  const recordId =
    generateId();


  const payload =
    createProductionPayload(
      recordId
    );


  setSaveButtonLoading(
    true
  );


  try {

    await fetch(
      CONFIG.apiUrl,
      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


    await delay(
      1600
    );


    const rows =
      await loadData();


    const dataExists =
      rows.some(
        function(row) {

          return (
            row.id ===
            recordId
          );

        }
      );


    if (dataExists) {

      alert(
        "Data berhasil masuk ke Google Sheets."
      );

      resetForm();

    }

    else {

      alert(
        "Data sudah dikirim. Tekan Muat ulang jika belum terlihat."
      );

    }

  }

  catch(error) {

    alert(
      "Gagal mengirim data. Periksa internet."
    );

  }

  finally {

    setSaveButtonLoading(
      false
    );

  }

}


/* =========================================================
   20. RESET FORM
   ========================================================= */

function resetForm() {

  getElement(
    "tanggal"
  ).value =
    getToday();


  if (
    CONFIG.machines.length >
    0
  ) {

    getElement(
      "mesin"
    ).value =
      CONFIG.machines[0];

  }


  getElement(
    "kain"
  ).value =
    "";


  getElement(
    "roll"
  ).value =
    "";


  getElement(
    "berat"
  ).value =
    "";


  getElement(
    "kendala"
  ).value =
    "";


  selectedShift =
    CONFIG.defaultShift;


  selectedStatus =
    CONFIG.defaultStatus;


  setActiveChoice(
    "shiftChoices",
    selectedShift
  );


  setActiveChoice(
    "statusChoices",
    selectedStatus
  );


  calculateTotalProduction();

}


/* =========================================================
   21. WARNA STATUS
   ========================================================= */

function getStatusClass(
  status
) {

  if (
    status ===
    "Berjalan"
  ) {

    return "green";

  }


  if (
    status ===
    "Perbaikan"
  ) {

    return "orange";

  }


  return "red";

}


/* =========================================================
   22. TAMPILKAN RIWAYAT
   ========================================================= */

function renderHistory() {

  const container =
    getElement(
      "riwayatList"
    );


  if (
    sharedData.length ===
    0
  ) {

    container.innerHTML =

      '<div class="empty">' +

      "Belum ada data bersama." +

      "</div>";


    return;

  }


  container.innerHTML =

    sharedData

      .map(
        function(record) {

          return `

            <div class="item">

              <div class="itemtop">

                <div>

                  <b>
                    ${escapeHtml(record.tanggal)}
                    ·
                    ${escapeHtml(record.shift)}
                  </b>

                  <div class="meta">

                    ${escapeHtml(record.mesin)}
                    ·
                    ${escapeHtml(record.jenisKain)}
                    · oleh
                    ${escapeHtml(record.penginput)}

                  </div>

                </div>


                <span
                  class="badge ${getStatusClass(record.status)}"
                >

                  ${escapeHtml(record.status)}

                </span>

              </div>


              <span class="badge">

                ${record.jumlahRoll}
                roll

              </span>


              <span class="badge">

                ${record.totalKg}
                kg

              </span>


              <span class="badge">

                Kendala:
                ${escapeHtml(record.kendala)}

              </span>

            </div>

          `;

        }
      )

      .join("");

}


/* =========================================================
   23. HITUNG TOTAL KG
   ========================================================= */

function calculateTotalKg() {

  return sharedData
    .reduce(
      function(
        total,
        record
      ) {

        return (
          total +
          Number(
            record.totalKg ||
            0
          )
        );

      },
      0
    );

}


/* =========================================================
   24. HITUNG TOTAL ROLL
   ========================================================= */

function calculateTotalRoll() {

  return sharedData
    .reduce(
      function(
        total,
        record
      ) {

        return (
          total +
          Number(
            record.jumlahRoll ||
            0
          )
        );

      },
      0
    );

}


/* =========================================================
   25. HITUNG STATUS BERJALAN
   ========================================================= */

function countRunningMachines() {

  return sharedData
    .filter(
      function(record) {

        return (
          record.status ===
          "Berjalan"
        );

      }
    )
    .length;

}


/* =========================================================
   26. HITUNG PRODUKSI PER SHIFT
   ========================================================= */

function calculateProductionPerShift() {

  const result = {};


  CONFIG.shifts
    .forEach(
      function(shift) {

        result[shift] =
          0;

      }
    );


  sharedData
    .forEach(
      function(record) {

        if (
          result[
            record.shift
          ] !== undefined
        ) {

          result[
            record.shift
          ] +=
            Number(
              record.totalKg ||
              0
            );

        }

      }
    );


  return result;

}


/* =========================================================
   27. TAMPILKAN REKAP
   ========================================================= */

function renderRecap() {

  const totalKg =
    calculateTotalKg();


  const totalRoll =
    calculateTotalRoll();


  const running =
    countRunningMachines();


  const productionPerShift =
    calculateProductionPerShift();


  getElement(
    "rekapKg"
  ).textContent =

    totalKg
      .toLocaleString(
        "id-ID"
      ) +

    " kg";


  getElement(
    "rekapRoll"
  ).textContent =

    totalRoll;


  getElement(
    "rekapData"
  ).textContent =

    sharedData.length;


  getElement(
    "rekapJalan"
  ).textContent =

    running;


  getElement(
    "shiftSummary"
  ).innerHTML =

    CONFIG.shifts

      .map(
        function(shift) {

          return (

            escapeHtml(
              shift
            ) +

            ": <b>" +

            productionPerShift[
              shift
            ] +

            " kg</b>"

          );

        }
      )

      .join("<br>");

}


/* =========================================================
   28. RENDER SEMUA
   ========================================================= */

function renderAllData() {

  renderHistory();

  renderRecap();

}


/* =========================================================
   29. NAVIGASI HALAMAN
   ========================================================= */

function openScreen(
  screenId,
  title
) {

  document
    .querySelectorAll(
      ".screen"
    )
    .forEach(
      function(screen) {

        screen.classList
          .remove(
            "active"
          );

      }
    );


  getElement(
    screenId
  )
    .classList
    .add(
      "active"
    );


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      function(button) {

        button.classList
          .toggle(

            "active",

            button.dataset.screen ===
              screenId

          );

      }
    );


  getElement(
    "pageTitle"
  ).textContent =
    title;


  if (
    screenId !==
    "inputScreen"
  ) {

    loadData()
      .catch(
        function() {}
      );

  }

}


/* =========================================================
   30. EVENT UTAMA
   ========================================================= */

function bindMainEvents() {

  getElement(
    "roll"
  )
    .addEventListener(
      "input",
      calculateTotalProduction
    );


  getElement(
    "berat"
  )
    .addEventListener(
      "input",
      calculateTotalProduction
    );


  getElement(
    "saveBtn"
  )
    .addEventListener(
      "click",
      saveProductionData
    );


  getElement(
    "reload1"
  )
    .addEventListener(
      "click",
      function() {

        loadData()
          .catch(
            function() {}
          );

      }
    );


  getElement(
    "reload2"
  )
    .addEventListener(
      "click",
      function() {

        loadData()
          .catch(
            function() {}
          );

      }
    );


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            openScreen(

              button.dataset.screen,

              button.dataset.title

            );

          }
        );

      }
    );

}


/* =========================================================
   31. SERVICE WORKER
   ========================================================= */

function registerServiceWorker() {

  if (
    !(
      "serviceWorker"
      in navigator
    )
  ) {

    return;

  }


  window.addEventListener(
    "load",
    function() {

      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          function() {}
        );

    }
  );

}


/* =========================================================
   32. INITIALIZE APLIKASI
   ========================================================= */

function initializeApplication() {

  /* Buat daftar mesin */

  setupMachineOptions();


  /* Buat Shift & Status */

  setupChoiceButtons();


  /* Tanggal otomatis */

  getElement(
    "tanggal"
  ).value =
    getToday();


  /* Ambil nama terakhir */

  getElement(
    "penginput"
  ).value =

    localStorage
      .getItem(
        "nama_penginput"
      ) ||

    "";


  /* Event */

  bindMainEvents();


  /* Tampilkan data awal */

  renderAllData();


  /* Ambil data Google Sheets */

  loadData()
    .catch(
      function() {}
    );


  /* Aktifkan PWA */

  registerServiceWorker();

}


/* =========================================================
   33. JALANKAN APLIKASI
   ========================================================= */

initializeApplication();

</script>
